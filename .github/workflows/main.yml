name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Windows
        run: |
          dotnet publish TelegramSelfDestructDownloader.sln \
            -c Release -r win-x64 --self-contained true \
            /p:PublishSingleFile=true \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o out/win

      - name: Build Linux
        run: |
          dotnet publish TelegramSelfDestructDownloader.sln \
            -c Release -r linux-x64 --self-contained true \
            /p:PublishSingleFile=true \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o out/linux

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/win/TelegramSelfDestructDownloader.exe
            out/linux/TelegramSelfDestructDownloader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
